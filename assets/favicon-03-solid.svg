<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="100%" height="100%">
  <defs>
    <!-- Front Face Lavender-to-Purple Gradient -->
    <linearGradient id="solidCFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ddd6fe"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="85%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Top & Left Specular Rim Light -->
    <linearGradient id="solidCRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- 3D Extrusion Depth (Right faces) -->
    <linearGradient id="solidCExtrudeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- 3D Extrusion Depth (Bottom faces) -->
    <linearGradient id="solidCExtrudeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e0836"/>
    </linearGradient>

    <!-- Subtle Ambient Neon Glow for transparent backgrounds -->
    <filter id="cTabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#581c87" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 3D Modular Block C (Transparent Background, 13.5° Slant) -->
  <g transform="translate(38, 8) skewX(-13.5)" filter="url(#cTabGlow)">
    
    <!-- 3D Extrusion Depth Faces -->
    <!-- Top Right End Extrusion -->
    <polygon points="106,0 117,9 117,37 106,28" fill="url(#solidCExtrudeRight)"/>
    <polygon points="34,28 106,28 117,37 45,37" fill="url(#solidCExtrudeBottom)"/>
    
    <!-- Spine Right Crevice Extrusion -->
    <polygon points="32,28 44,37 44,107 32,98" fill="url(#solidCExtrudeRight)"/>
    
    <!-- Bottom Right End Extrusion -->
    <polygon points="96,98 107,107 107,135 96,126" fill="url(#solidCExtrudeRight)"/>
    <polygon points="22,126 96,126 107,135 33,135" fill="url(#solidCExtrudeBottom)"/>
    <polygon points="0,98 22,126 33,135 0,107" fill="url(#solidCExtrudeBottom)"/>

    <!-- FRONT KEYCAP MODULAR FACES -->
    <!-- Top-Left Diagonal Chamfer Wedge Block -->
    <polygon points="10,14 32,0 32,28 0,28" fill="url(#solidCFront)" stroke="url(#solidCRim)" stroke-width="1.4"/>
    
    <!-- Top Block 1 -->
    <rect x="36" y="0" width="32" height="28" rx="3" fill="url(#solidCFront)" stroke="url(#solidCRim)" stroke-width="1.4"/>
    
    <!-- Top Block 2 (End Cap) -->
    <rect x="72" y="0" width="34" height="28" rx="3.5" fill="url(#solidCFront)" stroke="url(#solidCRim)" stroke-width="1.4"/>

    <!-- Left Spine Blocks -->
    <rect x="0" y="32" width="32" height="18" rx="3" fill="url(#solidCFront)" stroke="url(#solidCRim)" stroke-width="1.4"/>
    <rect x="0" y="54" width="32" height="18" rx="3" fill="url(#solidCFront)" stroke="url(#solidCRim)" stroke-width="1.4"/>
    <rect x="0" y="76" width="32" height="18" rx="3" fill="url(#solidCFront)" stroke="url(#solidCRim)" stroke-width="1.4"/>

    <!-- Bottom-Left Diagonal Chamfer Wedge Block -->
    <polygon points="0,98 32,98 22,126 0,98" fill="url(#solidCFront)" stroke="url(#solidCRim)" stroke-width="1.4"/>
    
    <!-- Bottom Block 1 -->
    <rect x="26" y="98" width="32" height="28" rx="3" fill="url(#solidCFront)" stroke="url(#solidCRim)" stroke-width="1.4"/>
    
    <!-- Bottom Block 2 (End Cap) -->
    <rect x="62" y="98" width="34" height="28" rx="3.5" fill="url(#solidCFront)" stroke="url(#solidCRim)" stroke-width="1.4"/>
  </g>
</svg>
