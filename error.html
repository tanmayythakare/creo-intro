<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Creo</title>
  <meta http-equiv="refresh" content="5;url=/">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #060a10;
      color: #e2e8f0;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      text-align: center;
    }
    .code {
      font-size: 6rem;
      font-weight: 800;
      color: #a855f7;
      text-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
      letter-spacing: 0.15em;
    }
    .message {
      margin-top: 1rem;
      font-size: 1.25rem;
      color: #94a3b8;
    }
    .redirect {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #64748b;
    }
    .redirect a {
      color: #a855f7;
      text-decoration: none;
    }
    .redirect a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <div class="message">This page does not exist.</div>
  <div class="redirect">
    Redirecting to <a href="/">home</a> in 5 seconds...
  </div>
</body>
</html>
