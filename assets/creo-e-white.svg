<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="whiteFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="whiteRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="whiteExtrudeSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="whiteExtrudeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <g transform="skewX(-13) translate(10, 3)">
    <!-- 3D Depth / Extrusions -->
    <polygon points="106,0 114,7 114,35 106,28" fill="url(#whiteExtrudeSide)"/>
    <polygon points="32,28 106,28 114,35 40,35" fill="url(#whiteExtrudeBottom)"/>
    <polygon points="32,28 40,35 40,54 32,54" fill="url(#whiteExtrudeSide)"/>
    <polygon points="86,52 94,59 94,79 86,72" fill="url(#whiteExtrudeSide)"/>
    <polygon points="32,72 86,72 94,79 40,79" fill="url(#whiteExtrudeBottom)"/>
    <polygon points="32,72 40,79 40,105 32,98" fill="url(#whiteExtrudeSide)"/>
    <polygon points="96,98 104,105 104,133 96,126" fill="url(#whiteExtrudeSide)"/>
    <polygon points="22,126 96,126 104,133 30,133" fill="url(#whiteExtrudeBottom)"/>
    <polygon points="0,98 22,126 30,133 0,105" fill="url(#whiteExtrudeBottom)"/>

    <!-- Front Modular Keycap Blocks for 'E' -->
    <polygon points="10,14 32,0 32,28 0,28" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>
    <rect x="36" y="0" width="32" height="28" rx="3.5" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>
    <rect x="72" y="0" width="34" height="28" rx="4" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>

    <rect x="0" y="32" width="32" height="18" rx="3" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>
    <rect x="0" y="54" width="32" height="18" rx="3" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>
    <rect x="0" y="76" width="32" height="18" rx="3" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>

    <rect x="36" y="54" width="28" height="18" rx="3" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>
    <rect x="68" y="54" width="24" height="18" rx="3" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>

    <polygon points="0,98 32,98 22,126 0,98" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>
    <rect x="26" y="98" width="32" height="28" rx="3.5" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>
    <rect x="62" y="98" width="34" height="28" rx="4" fill="url(#whiteFrontGrad)" stroke="url(#whiteRimGrad)" stroke-width="1.4"/>
  </g>
</svg>
