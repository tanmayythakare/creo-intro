<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 190" width="100%" height="100%">
  <defs>
    <!-- Main Pixel Face Gradient -->
    <linearGradient id="pixelGradTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#f0abfc"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="pixelRimTrans" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>

    <!-- Glowing Magenta Filter -->
    <filter id="pixelGlowTrans" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#c084fc" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#a21caf" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 8-Bit Pixel Matrix C (Transparent Background) -->
  <g transform="translate(6, 6)" filter="url(#pixelGlowTrans)">
    <!-- Top Arm Row 1 -->
    <rect x="54" y="14" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="76" y="14" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="98" y="14" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="120" y="14" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>

    <!-- Top Arm Row 2 -->
    <rect x="32" y="36" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="54" y="36" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="76" y="36" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="98" y="36" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="120" y="36" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>

    <!-- Spine Columns -->
    <rect x="10" y="58" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="32" y="58" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>

    <rect x="0" y="80" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="22" y="80" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>

    <rect x="0" y="102" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="22" y="102" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>

    <rect x="10" y="124" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="32" y="124" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>

    <!-- Bottom Arm Row 1 -->
    <rect x="32" y="146" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="54" y="146" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="76" y="146" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="98" y="146" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>

    <!-- Bottom Arm Row 2 -->
    <rect x="54" y="168" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="76" y="168" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>
    <rect x="98" y="168" width="18" height="18" rx="3.5" fill="url(#pixelGradTrans)" stroke="url(#pixelRimTrans)" stroke-width="0.8"/>

    <!-- Floating Digital Particles -->
    <rect x="142" y="146" width="14" height="14" rx="3" fill="#a21caf" opacity="0.4"/>
    <rect x="156" y="124" width="10" height="10" rx="2" fill="#c084fc" opacity="0.3"/>
  </g>
</svg>
